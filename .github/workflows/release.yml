name: Build & Release

# Builds every app in apps/ on a macOS runner, uploads each as a downloadable
# artifact, and publishes a GitHub Release when asked to.
#
# Apps are discovered from the apps/ directory, so a new app needs a directory
# and a Package.swift target — not a change to this file.
#
# HOW A RELEASE IS TRIGGERED
#   [release]        in a commit message on main → patch bump, every app
#   [release:minor]  likewise, minor bump
#   [release:major]  likewise, major bump
#   workflow_dispatch with publish=true          → chosen bump, chosen app
#   v1.2.3 tag pushed by hand                    → every app at that exact version
#   minime-v0.1.0 tag pushed by hand             → that app at that exact version
#   anything else (plain push, PR)               → build + artifacts only
#
# VERSIONING
# The latest git tag is the source of truth for what was last released, not
# Info.plist — a tag cannot drift from the release it names. The next version is
# that tag incremented, stamped into Info.plist at build time so the shipped
# bundle agrees with its tag, then committed back to main so the repo agrees
# too. Each app is versioned and tagged independently:
#   Upright → v<version>            (the Homebrew cask's URL depends on this)
#   others  → <app>-v<version>
#
# Each app ships twice, plus install notes:
#   <App>.zip  — stable filename, this is what the Homebrew cask downloads
#   <App>.dmg  — drag-to-Applications installer
#   INSTALL.txt — including the Gatekeeper un-quarantine step
on:
  push:
    branches: [main]
    tags:
      - "v*"
      - "*-v*"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release (otherwise build only)"
        type: boolean
        default: false
      bump:
        description: "Which part of the version to increment"
        type: choice
        options: [patch, minor, major]
        default: patch
      app:
        description: "App to release, or 'all'"
        type: string
        default: all

permissions:
  contents: write   # create tags, releases, and the version-bump commit

# macOS runners bill at 10x, so don't leave superseded builds running. Tags and
# releases are exempt: cancelling half way would leave a release with only some
# of its apps attached.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !contains(github.event.head_commit.message, '[release') }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      mode: ${{ steps.plan.outputs.mode }}
      bump: ${{ steps.plan.outputs.bump }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out what to build and whether to publish
        id: plan
        run: |
          set -euo pipefail
          ALL="$(find apps -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)"
          if [ -z "$ALL" ]; then
            echo "::error::no apps found under apps/"
            exit 1
          fi
          echo "Apps in repo:"; echo "$ALL" | sed 's/^/  /'

          SELECTED="$ALL"
          # mode: none = build only | auto = compute next version | tag = use the pushed tag
          MODE="none"
          BUMP="patch"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            MODE="tag"
            TAG="${GITHUB_REF_NAME}"
            case "$TAG" in
              v*)
                SELECTED="$ALL"   # a plain version tag releases the whole collection
                ;;
              *-v*)
                PREFIX="${TAG%%-v*}"
                SELECTED="$(echo "$ALL" | awk -v p="$PREFIX" 'tolower($0) == tolower(p)')"
                if [ -z "$SELECTED" ]; then
                  echo "::error::tag '$TAG' names no app under apps/ (looked for '$PREFIX')"
                  exit 1
                fi
                ;;
              *)
                echo "::error::tag '$TAG' does not match v* or <app>-v*"
                exit 1
                ;;
            esac
            echo "Tag $TAG selects: $SELECTED"

          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.publish }}" = "true" ]; then
              MODE="auto"
              BUMP="${{ inputs.bump }}"
            fi
            WANT="${{ inputs.app }}"
            if [ -n "$WANT" ] && [ "$WANT" != "all" ]; then
              SELECTED="$(echo "$ALL" | awk -v p="$WANT" 'tolower($0) == tolower(p)')"
              if [ -z "$SELECTED" ]; then
                echo "::error::input app='$WANT' names no app under apps/"
                exit 1
              fi
            fi

          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            # Release flag in the commit message. Read from git rather than the
            # event payload so it behaves the same for pushes of several commits.
            MSG="$(git log -1 --pretty=%B)"
            case "$MSG" in
              *'[release:major]'*) MODE="auto"; BUMP="major" ;;
              *'[release:minor]'*) MODE="auto"; BUMP="minor" ;;
              *'[release]'*)       MODE="auto"; BUMP="patch" ;;
            esac
            [ "$MODE" = "auto" ] && echo "Release flag found in commit message → $BUMP bump"
          fi

          # Fail early on an app build.sh could never package.
          MISSING=""
          for app in $SELECTED; do
            [ -f "apps/$app/Resources/Info.plist" ] || MISSING="$MISSING $app"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::missing Resources/Info.plist for:$MISSING"
            exit 1
          fi

          JSON="$(echo "$SELECTED" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          {
            echo "apps=$JSON"
            echo "mode=$MODE"
            echo "bump=$BUMP"
          } >> "$GITHUB_OUTPUT"
          echo "Matrix: $JSON   mode=$MODE   bump=$BUMP"

  build:
    name: Build ${{ matrix.app }}
    needs: plan
    runs-on: macos-14   # Apple Silicon, macOS 14 — matches the apps' min OS
    strategy:
      fail-fast: false
      # One app at a time when publishing: matrix jobs would otherwise race to
      # create releases and push tags.
      max-parallel: ${{ needs.plan.outputs.mode == 'none' && 4 || 1 }}
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tags are the version source of truth, and a shallow clone has none.
          fetch-depth: 0

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          APP_NAME="${{ matrix.app }}"
          APP_LOWER="$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]')"
          PLIST="apps/${APP_NAME}/Resources/Info.plist"
          MODE="${{ needs.plan.outputs.mode }}"
          BUMP="${{ needs.plan.outputs.bump }}"

          # Upright keeps the bare v<version> scheme because the Homebrew cask's
          # download URL is built from it; every other app is namespaced.
          if [ "$APP_NAME" = "Upright" ]; then PREFIX="v"; else PREFIX="${APP_LOWER}-v"; fi

          case "$MODE" in
            tag)
              # Version comes from the tag that triggered this run.
              TAG="${GITHUB_REF_NAME}"
              VERSION="${TAG##*v}"
              ;;
            auto)
              LAST="$(git tag -l "${PREFIX}[0-9]*" | sed "s|^${PREFIX}||" | sort -V | tail -1)"
              if [ -z "$LAST" ]; then
                # Never released: ship what the plist already claims rather than
                # inventing a version ahead of it.
                VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
                echo "No ${PREFIX}* tag yet — first release at plist version $VERSION"
              else
                IFS=. read -r MA MI PA <<< "$LAST"
                MA=${MA:-0}; MI=${MI:-0}; PA=${PA:-0}
                case "$BUMP" in
                  major) MA=$((MA + 1)); MI=0; PA=0 ;;
                  minor) MI=$((MI + 1)); PA=0 ;;
                  *)     PA=$((PA + 1)) ;;
                esac
                VERSION="${MA}.${MI}.${PA}"
                echo "Last ${PREFIX}* tag was $LAST → $BUMP → $VERSION"
              fi
              TAG="${PREFIX}${VERSION}"
              ;;
            *)
              VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
              TAG=""
              ;;
          esac

          # Stamp it so the shipped bundle agrees with the tag naming it.
          # CFBundleVersion uses the run number, which only ever increases.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST"

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::${APP_NAME} ${VERSION}${TAG:+ (tag $TAG)}"

      - name: Check app icon
        run: |
          ICON="apps/${{ matrix.app }}/Resources/AppIcon.icns"
          if [ -f "$ICON" ]; then
            echo "Using committed $ICON ($(du -h "$ICON" | cut -f1))"
          else
            echo "::warning::$ICON is missing — the bundle will ship without an icon"
          fi

      - name: Build the .app bundle
        run: |
          chmod +x build.sh
          ./build.sh release "${{ matrix.app }}"

      - name: Package zip + dmg
        id: package
        run: |
          set -euo pipefail
          APP_NAME="${{ matrix.app }}"
          VERSION="${{ steps.version.outputs.version }}"

          # Locate the assembled bundle rather than guessing the arch subfolder
          # from `swift build --show-bin-path`, which can differ from where
          # build.sh actually drops the bundle.
          APP="$(find .build -type d -name "${APP_NAME}.app" -print -quit)"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::${APP_NAME}.app not found under .build"
            find .build -maxdepth 4 -name '*.app' -print || true
            exit 1
          fi
          echo "Found app bundle: $APP"

          # ditto preserves the bundle's symlinks/metadata better than `zip`.
          # The cask downloads this exact filename, so it must stay stable.
          ditto -c -k --sequesterRsrc --keepParent "$APP" "${APP_NAME}.zip"

          # A drag-to-Applications disk image for people not using Homebrew.
          STAGE="$(mktemp -d)/${APP_NAME}"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "$APP_NAME" -srcfolder "$STAGE" \
            -ov -format UDZO -quiet "${APP_NAME}.dmg"

          ZIP_SHA="$(shasum -a 256 "${APP_NAME}.zip" | awk '{print $1}')"
          DMG_SHA="$(shasum -a 256 "${APP_NAME}.dmg" | awk '{print $1}')"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          {
            echo "sha256=$ZIP_SHA"
            echo "short_sha=$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"

          # These builds are ad-hoc signed (no Developer ID), and anything
          # downloaded from GitHub arrives quarantined. That combination makes
          # macOS report the app as "damaged" — the least informative error it
          # has. Ship the fix next to the bundle so whoever downloads it finds
          # it without hunting through the README.
          cat > INSTALL.txt <<EOF
          ${APP_NAME} ${VERSION} (${SHORT_SHA})

          Two ways in:
            • ${APP_NAME}.dmg — open it, drag ${APP_NAME} to Applications
            • ${APP_NAME}.zip — unzip and move ${APP_NAME}.app to /Applications

          FIRST LAUNCH
          This build is ad-hoc signed (no paid Apple Developer ID), so macOS
          may say it is "damaged and can't be opened". It is not damaged — that
          is Gatekeeper refusing an unsigned app that carries the quarantine
          flag set on every browser download. Clear it once:

            xattr -dr com.apple.quarantine "/Applications/${APP_NAME}.app"

          Then open ${APP_NAME} from Launchpad or Spotlight. It is a menu-bar
          agent: it has no Dock icon and no window, look for it in the menu bar.

          Requires macOS 14 or newer, Apple Silicon.

          sha256  ${APP_NAME}.zip  ${ZIP_SHA}
          sha256  ${APP_NAME}.dmg  ${DMG_SHA}
          EOF

          {
            echo "### ${APP_NAME} ${VERSION}"
            echo ""
            echo "| Asset | sha256 |"
            echo "| --- | --- |"
            echo "| \`${APP_NAME}.zip\` | \`${ZIP_SHA}\` |"
            echo "| \`${APP_NAME}.dmg\` | \`${DMG_SHA}\` |"
            echo ""
            echo "Ad-hoc signed, so clear the quarantine flag once after installing:"
            echo ""
            echo '```bash'
            echo "xattr -dr com.apple.quarantine \"/Applications/${APP_NAME}.app\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts (every run)
        uses: actions/upload-artifact@v4
        with:
          # Version + commit in the name so downloads from different runs can
          # be told apart once they're sitting in ~/Downloads.
          name: ${{ matrix.app }}-${{ steps.version.outputs.version }}-${{ steps.package.outputs.short_sha }}
          path: |
            ${{ matrix.app }}.zip
            ${{ matrix.app }}.dmg
            INSTALL.txt
          # Default is `warn`, which would let a silent packaging failure pass
          # as a green run with an empty artifact.
          if-no-files-found: error
          retention-days: 90

      # Artifacts need a logged-in GitHub account to download, even on a public
      # repo, and they expire. A release is the only way to hand someone a link
      # that just works — so publishing is what makes these builds usable.
      - name: Publish GitHub Release
        if: needs.plan.outputs.mode != 'none'
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push this is the tag that triggered the run; on an auto
          # release it's computed, and the action creates the tag here.
          tag_name: ${{ steps.version.outputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ matrix.app }}.zip
            ${{ matrix.app }}.dmg
            INSTALL.txt
          fail_on_unmatched_files: true
          # A hand-pushed v* tag puts every app on one release, so each job
          # appends its own section rather than overwriting the previous app's.
          append_body: true
          body: |
            ### ${{ matrix.app }} ${{ steps.version.outputs.version }}

            | Asset | What it's for |
            | --- | --- |
            | `${{ matrix.app }}.dmg` | Open, drag to Applications |
            | `${{ matrix.app }}.zip` | Unzip, move to /Applications |

            Ad-hoc signed (no paid Apple Developer ID), so macOS may call it
            "damaged" on first launch. It isn't — that's Gatekeeper reacting to
            the quarantine flag every download carries. Clear it once:

            ```bash
            xattr -dr com.apple.quarantine "/Applications/${{ matrix.app }}.app"
            ```

            Requires macOS 14 or newer, Apple Silicon.

            `${{ matrix.app }}.zip` sha256: `${{ steps.package.outputs.sha256 }}`

  # Record the released version back in the repo, so Info.plist and
  # scripts/update-cask.sh agree with what actually shipped. Runs once, after
  # every app has published, and reads each version from the tags that now
  # exist rather than recomputing a bump (which would double-increment).
  record-versions:
    name: Commit version bump
    needs: [plan, build]
    if: needs.plan.outputs.mode == 'auto' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Write released versions into Info.plist
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          CHANGED=0
          for app in $(echo '${{ needs.plan.outputs.apps }}' | jq -r '.[]'); do
            lower="$(echo "$app" | tr '[:upper:]' '[:lower:]')"
            if [ "$app" = "Upright" ]; then prefix="v"; else prefix="${lower}-v"; fi
            latest="$(git tag -l "${prefix}[0-9]*" | sed "s|^${prefix}||" | sort -V | tail -1)"
            [ -z "$latest" ] && continue

            plist="apps/${app}/Resources/Info.plist"
            current="$(sed -n '/<key>CFBundleShortVersionString<\/key>/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' "$plist")"
            if [ "$current" != "$latest" ]; then
              # No PlistBuddy on Linux; these plists are plain XML.
              python3 - "$plist" "$latest" <<'PY'
          import re, sys
          path, version = sys.argv[1], sys.argv[2]
          src = open(path).read()
          src = re.sub(r'(<key>CFBundleShortVersionString</key>\s*<string>)[^<]*(</string>)',
                       lambda m: m.group(1) + version + m.group(2), src, count=1)
          open(path, 'w').write(src)
          PY
              echo "  $app: $current → $latest"
              CHANGED=1
            fi
          done
          echo "changed=$CHANGED" >> "$GITHUB_ENV"

      - name: Commit
        if: env.changed == '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: record released versions [skip ci]"
          git push
