name: Release

# Builds a signed (ad-hoc) Upright.app on a macOS runner, zips it, and attaches
# it to the GitHub Release. Triggered when you push a version tag (e.g. v0.1.1);
# can also be run manually to produce a downloadable build artifact.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # required to upload assets to the release

jobs:
  build:
    runs-on: macos-14   # Apple Silicon, macOS 14 (Sonoma) — matches the app's min OS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Ensure app icon
        run: |
          # Prefer the committed Resources/AppIcon.icns (generated from
          # docs/icon.png). Only fall back to the SF-symbol generator if it's
          # missing, so releases ship the real icon.
          if [ -f Resources/AppIcon.icns ]; then
            echo "Using committed Resources/AppIcon.icns ($(du -h Resources/AppIcon.icns | cut -f1))"
          else
            swift scripts/make_icon.swift || echo "icon generation skipped"
          fi

      - name: Build the .app bundle
        run: |
          chmod +x build.sh
          ./build.sh release

      - name: Package Upright.app into a zip
        id: package
        run: |
          # Locate the assembled bundle directly instead of guessing the arch
          # subfolder from `swift build --show-bin-path` (which can differ from
          # where build.sh actually drops Upright.app).
          APP="$(find .build -type d -name 'Upright.app' -print -quit)"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::Upright.app not found under .build"
            find .build -maxdepth 4 -name '*.app' -print || true
            exit 1
          fi
          echo "Found app bundle: $APP"
          # ditto preserves the bundle's symlinks/metadata better than `zip`.
          ditto -c -k --sequesterRsrc --keepParent "$APP" "Upright.zip"
          SHA="$(shasum -a 256 Upright.zip | awk '{print $1}')"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### Upright release artifact"
            echo ""
            echo "- **File:** \`Upright.zip\`"
            echo "- **sha256:** \`$SHA\`"
            echo ""
            echo "Update \`version\` + \`sha256\` in the tap's \`Casks/upright.rb\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: Upright-zip
          path: Upright.zip

      - name: Attach to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Upright.zip
          fail_on_unmatched_files: true
