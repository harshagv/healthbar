name: Build & Release

# Builds every app in apps/ on a macOS runner and, for tag pushes, attaches an
# installable bundle for each to the GitHub Release.
#
# Apps are discovered from the apps/ directory, so a new app needs a directory
# and a Package.swift target — not a change to this file.
#
# Tag routing:
#   v1.2.3           → every app, published together in one release
#   minime-v0.1.0    → that app alone (matched case-insensitively)
#   <app>-v<version> → likewise
#   push / PR / manual run → every app, build only, nothing published
#
# Each app ships twice:
#   <App>.zip  — stable filename, this is what the Homebrew cask downloads
#   <App>.dmg  — drag-to-Applications installer for people not using Homebrew
on:
  push:
    branches: [main]
    tags:
      - "v*"
      - "*-v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # required to upload assets to the release

jobs:
  discover:
    name: Discover apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out which apps to build
        id: list
        run: |
          set -euo pipefail
          ALL="$(find apps -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)"
          if [ -z "$ALL" ]; then
            echo "::error::no apps found under apps/"
            exit 1
          fi
          echo "Apps in repo:"; echo "$ALL" | sed 's/^/  /'

          SELECTED="$ALL"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            case "$TAG" in
              v*)
                # A plain version tag releases the whole collection.
                SELECTED="$ALL"
                ;;
              *-v*)
                PREFIX="${TAG%%-v*}"
                SELECTED="$(echo "$ALL" | awk -v p="$PREFIX" 'tolower($0) == tolower(p)')"
                if [ -z "$SELECTED" ]; then
                  echo "::error::tag '$TAG' names no app under apps/ (looked for '$PREFIX')"
                  exit 1
                fi
                ;;
              *)
                echo "::error::tag '$TAG' does not match v* or <app>-v*"
                exit 1
                ;;
            esac
            echo "Tag $TAG selects: $SELECTED"
          fi

          # Fail early on an app build.sh could never package.
          MISSING=""
          for app in $SELECTED; do
            [ -f "apps/$app/Resources/Info.plist" ] || MISSING="$MISSING $app"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::missing Resources/Info.plist for:$MISSING"
            exit 1
          fi

          JSON="$(echo "$SELECTED" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "apps=$JSON" >> "$GITHUB_OUTPUT"
          echo "Matrix: $JSON"

  build:
    name: Build ${{ matrix.app }}
    needs: discover
    runs-on: macos-14   # Apple Silicon, macOS 14 — matches the apps' min OS
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.apps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Check app icon
        run: |
          ICON="apps/${{ matrix.app }}/Resources/AppIcon.icns"
          if [ -f "$ICON" ]; then
            echo "Using committed $ICON ($(du -h "$ICON" | cut -f1))"
          else
            echo "::warning::$ICON is missing — the bundle will ship without an icon"
          fi

      - name: Build the .app bundle
        run: |
          chmod +x build.sh
          ./build.sh release "${{ matrix.app }}"

      - name: Package zip + dmg
        id: package
        run: |
          set -euo pipefail
          APP_NAME="${{ matrix.app }}"

          # Locate the assembled bundle rather than guessing the arch subfolder
          # from `swift build --show-bin-path`, which can differ from where
          # build.sh actually drops the bundle.
          APP="$(find .build -type d -name "${APP_NAME}.app" -print -quit)"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::${APP_NAME}.app not found under .build"
            find .build -maxdepth 4 -name '*.app' -print || true
            exit 1
          fi
          echo "Found app bundle: $APP"

          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "apps/${APP_NAME}/Resources/Info.plist" 2>/dev/null || echo "unknown")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # ditto preserves the bundle's symlinks/metadata better than `zip`.
          # The cask downloads this exact filename, so it must stay stable.
          ditto -c -k --sequesterRsrc --keepParent "$APP" "${APP_NAME}.zip"

          # A drag-to-Applications disk image for people not using Homebrew.
          STAGE="$(mktemp -d)/${APP_NAME}"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "$APP_NAME" -srcfolder "$STAGE" \
            -ov -format UDZO -quiet "${APP_NAME}.dmg"

          ZIP_SHA="$(shasum -a 256 "${APP_NAME}.zip" | awk '{print $1}')"
          DMG_SHA="$(shasum -a 256 "${APP_NAME}.dmg" | awk '{print $1}')"
          echo "sha256=$ZIP_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### ${APP_NAME} ${VERSION}"
            echo ""
            echo "| Asset | sha256 |"
            echo "| --- | --- |"
            echo "| \`${APP_NAME}.zip\` | \`${ZIP_SHA}\` |"
            echo "| \`${APP_NAME}.dmg\` | \`${DMG_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts (every run)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-bundles
          path: |
            ${{ matrix.app }}.zip
            ${{ matrix.app }}.dmg

      - name: Attach to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Matrix jobs append to the same release, so a `v*` tag ends up with
          # every app's bundles on a single release page.
          files: |
            ${{ matrix.app }}.zip
            ${{ matrix.app }}.dmg
          fail_on_unmatched_files: true
