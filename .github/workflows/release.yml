name: Build & Release

# Builds every app in apps/ on a macOS runner, zips each bundle, and — for tag
# pushes — attaches them to the GitHub Release.
#
# Apps are discovered from the apps/ directory, so adding a new app needs a
# directory and a Package.swift target, not a change to this file.
#
# Tag routing:
#   v1.2.3           → Upright only (legacy; keeps the existing cask flow working)
#   minime-v0.1.0    → MiniMe only
#   <app>-v<version> → that app only, matched case-insensitively
#   push / PR / manual run → every app, build only, nothing published
on:
  push:
    branches: [main]
    tags:
      - "v*"
      - "*-v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # required to upload assets to the release

jobs:
  discover:
    name: Discover apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out which apps to build
        id: list
        run: |
          set -euo pipefail
          ALL="$(find apps -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)"
          if [ -z "$ALL" ]; then
            echo "::error::no apps found under apps/"
            exit 1
          fi
          echo "Apps in repo:"; echo "$ALL" | sed 's/^/  /'

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            case "$TAG" in
              v*)
                # Legacy tag shape, from before the repo held more than one app.
                SELECTED="Upright"
                ;;
              *-v*)
                PREFIX="${TAG%%-v*}"
                SELECTED="$(echo "$ALL" | awk -v p="$PREFIX" 'tolower($0) == tolower(p)')"
                if [ -z "$SELECTED" ]; then
                  echo "::error::tag '$TAG' names no app under apps/ (looked for '$PREFIX')"
                  exit 1
                fi
                ;;
              *)
                echo "::error::tag '$TAG' does not match v* or <app>-v*"
                exit 1
                ;;
            esac
            echo "Tag $TAG selects: $SELECTED"
          else
            SELECTED="$ALL"
          fi

          # Fail early on an app that build.sh could never package.
          MISSING=""
          for app in $SELECTED; do
            [ -f "apps/$app/Resources/Info.plist" ] || MISSING="$MISSING $app"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::missing Resources/Info.plist for:$MISSING"
            exit 1
          fi

          JSON="$(echo "$SELECTED" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "apps=$JSON" >> "$GITHUB_OUTPUT"
          echo "Matrix: $JSON"

  build:
    name: Build ${{ matrix.app }}
    needs: discover
    runs-on: macos-14   # Apple Silicon, macOS 14 — matches the apps' min OS
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.apps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Check app icon
        run: |
          ICON="apps/${{ matrix.app }}/Resources/AppIcon.icns"
          if [ -f "$ICON" ]; then
            echo "Using committed $ICON ($(du -h "$ICON" | cut -f1))"
          else
            echo "::warning::$ICON is missing — the bundle will ship without an icon"
          fi

      - name: Build the .app bundle
        run: |
          chmod +x build.sh
          ./build.sh release "${{ matrix.app }}"

      - name: Package ${{ matrix.app }}.app into a zip
        id: package
        run: |
          set -euo pipefail
          APP_NAME="${{ matrix.app }}"
          # Locate the assembled bundle rather than guessing the arch subfolder
          # from `swift build --show-bin-path`, which can differ from where
          # build.sh actually drops the bundle.
          APP="$(find .build -type d -name "${APP_NAME}.app" -print -quit)"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::${APP_NAME}.app not found under .build"
            find .build -maxdepth 4 -name '*.app' -print || true
            exit 1
          fi
          echo "Found app bundle: $APP"

          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "apps/${APP_NAME}/Resources/Info.plist" 2>/dev/null || echo "unknown")"

          # ditto preserves the bundle's symlinks/metadata better than `zip`.
          ditto -c -k --sequesterRsrc --keepParent "$APP" "${APP_NAME}.zip"
          SHA="$(shasum -a 256 "${APP_NAME}.zip" | awk '{print $1}')"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### ${APP_NAME} ${VERSION}"
            echo ""
            echo "- **File:** \`${APP_NAME}.zip\`"
            echo "- **sha256:** \`${SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-zip
          path: ${{ matrix.app }}.zip

      - name: Attach to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.app }}.zip
          fail_on_unmatched_files: true
